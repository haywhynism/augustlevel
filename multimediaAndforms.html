<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia and Forms</title>
</head>

<body>

    <!-- how to import image from the PC and from the internet -->
    <img src="media/3.png" alt="dog" width="40px" height="40px">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRMn972hkHolYjh5kGjtG7LEDDuAXD0FiXGUM9UtkluHg&s=10"
        alt="">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVc2eHkzKA26dGfeGx7aTgRLX7bYAGfmcEbwvEyWNp5w&s=10"
        alt="">

    <!-- How to import video from the PC and from the internet -->
    <video src="media/Moon landing.mp4" controls autoplay loop muted></video>
    <video src="https://www.pexels.com/download/video/17592108/" height="600px" width="600px" controls loop
        autoplay></video>
    <video src="https://www.pexels.com/download/video/15830886/" height="600px" width="600px" controls loop
        autoplay></video>

    <!-- how to make import video from youtube -->
    <iframe width="800" height="900" src="https://www.youtube.com/embed/q36v2xZmCrk?si=MeVjjQ5Giuqgk026"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <!-- how to import audio from pc / internet -->
    <audio src=""></audio>
</body>

</html>
